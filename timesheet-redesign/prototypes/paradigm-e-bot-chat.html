<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>范式 E · Bot 对话记工</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f5f5; font-size: 14px; }
    .nav { background: #1a1a1a; color: #fff; padding: 12px 20px; display: flex; gap: 12px; align-items: center; }
    .nav a { color: #aaa; text-decoration: none; font-size: 13px; }
    .layout { display: grid; grid-template-columns: 1fr 300px; max-width: 1100px; margin: 0 auto; min-height: calc(100vh - 48px); }
    .chat-panel { display: flex; flex-direction: column; background: #fff; border-right: 1px solid #e5e5e5; }
    .chat-header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; gap: 12px; align-items: center; }
    .avatar { width: 40px; height: 40px; border-radius: 8px; background: #3370ff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 420px; }
    .msg { max-width: 88%; }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; }
    .bubble { padding: 12px 16px; border-radius: 12px; line-height: 1.55; font-size: 14px; }
    .msg.bot .bubble { background: #fff; border: 1px solid #eee; border-top-left-radius: 4px; }
    .msg.user .bubble { background: #95ec69; border-top-right-radius: 4px; }
    .card-inline { background: #f7f8fa; border: 1px solid #e5e6eb; border-radius: 8px; padding: 12px; margin-top: 10px; font-size: 13px; }
    .card-inline .row { display: flex; justify-content: space-between; margin: 4px 0; color: #888; }
    .card-inline button { margin-top: 8px; margin-right: 6px; padding: 6px 12px; border-radius: 6px; border: 1px solid #3370ff; background: #fff; color: #3370ff; cursor: pointer; font-size: 12px; }
    .card-inline button.primary { background: #3370ff; color: #fff; }
    .input-bar { padding: 12px 16px; border-top: 1px solid #eee; display: flex; gap: 8px; }
    .input-bar input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
    .input-bar button { padding: 10px 18px; background: #3370ff; color: #fff; border: none; border-radius: 20px; cursor: pointer; }
    .side-panel { padding: 20px; background: #fafafa; }
    .cmd { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 8px; font-size: 13px; cursor: pointer; }
    .cmd:hover { border-color: #3370ff; }
    .cmd code { color: #3370ff; font-size: 12px; }
    .stats { background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 16px; font-size: 13px; line-height: 1.8; border: 1px solid #eee; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html">← 返回导航</a>
    <span style="font-weight:600">范式 E · Bot（可交互）</span>
  </nav>
  <div class="layout">
    <div class="chat-panel">
      <div class="chat-header">
        <div class="avatar">🤖</div>
        <div><strong>工时助手</strong><br><small style="color:#888">飞书 Bot</small></div>
      </div>
      <div class="messages" id="messages">
        <div class="msg bot"><div class="bubble">你好！本周 W21 已提交 <strong id="bot-submitted">0h</strong>，草稿 <strong id="bot-draft">0h</strong>。<br>试试右侧快捷指令，或输入自然语言。</div></div>
      </div>
      <div class="input-bar">
        <input type="text" id="chat-input" placeholder="例如：记 8 小时到战略运营…">
        <button id="chat-send">发送</button>
      </div>
    </div>
    <aside class="side-panel">
      <div class="stats" id="stats">
        <strong>本周 W21 状态</strong><br>
        草稿：0h · 已提交：0h<br>
        待分配会议：1.5h
      </div>
      <p style="font-size:12px;color:#888;margin-bottom:10px">快捷指令（点击模拟发送）</p>
      <div class="cmd" data-cmd="帮我把昨天战略运营项目实施记 8 小时"><code>记 8h 到战略运营</code></div>
      <div class="cmd" data-cmd="把周三会议 1.5 小时记到天人合一方案实施"><code>会议归类</code></div>
      <div class="cmd" data-cmd="查看我这周还剩多少没填"><code>查看本周</code></div>
      <div class="cmd" data-cmd="提交本周工时"><code>提交本周</code></div>
    </aside>
  </div>
  <script src="shared.js"></script>
  <script>
    let draft = 0, submitted = 0;
    const msgs = document.getElementById('messages');

    function addMsg(text, who) {
      const d = document.createElement('div');
      d.className = 'msg ' + who;
      d.innerHTML = '<div class="bubble">' + text + '</div>';
      msgs.appendChild(d);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function updateStats() {
      document.getElementById('stats').innerHTML = '<strong>本周 W21 状态</strong><br>草稿：' + draft + 'h · 已提交：' + submitted + 'h';
      document.getElementById('bot-submitted').textContent = submitted + 'h';
      document.getElementById('bot-draft').textContent = draft + 'h';
    }

    function handleCmd(text) {
      addMsg(text, 'user');
      setTimeout(() => {
        if (text.includes('8 小时') || text.includes('8h')) {
          addMsg('已生成草稿卡片：<div class="card-inline"><strong>战略运营 › 软件详细设计</strong><div class="row"><span>工时</span><span>8h</span></div><div class="row"><span>Booking</span><span style="color:#059669">自动接收</span></div><button class="primary" onclick="confirmDraft(8,6,2)">确认写入草稿</button><button onclick="showToast(\'已取消\',\'info\')">取消</button></div>', 'bot');
        } else if (text.includes('会议') || text.includes('天人合一')) {
          addMsg('已匹配会议，写入 <strong>天人合一 › 方案实施 · 1.5h</strong> 草稿。<button class="primary" style="margin-top:8px;padding:6px 12px;border:none;border-radius:6px;background:#3370ff;color:#fff;cursor:pointer" onclick="confirmDraft(1.5,0,1.5)">确认</button>', 'bot');
        } else if (text.includes('查看') || text.includes('还剩')) {
          addMsg('本周合计约 <strong>' + (draft + submitted) + 'h</strong>（草稿 ' + draft + 'h + 已提交 ' + submitted + 'h）。标准 40h。', 'bot');
        } else if (text.includes('提交')) {
          if (draft <= 0) { addMsg('当前没有待确认草稿。请先记工或确认卡片。', 'bot'); return; }
          addMsg('即将提交草稿合计 <strong>' + draft + 'h</strong>。<button class="primary" style="margin-top:8px;padding:6px 12px;border:none;border-radius:6px;background:#3370ff;color:#fff;cursor:pointer" onclick="doSubmit()">确认提交本周</button>', 'bot');
        } else {
          addMsg('我可以帮你：记工、查工时、提交。试试右侧快捷指令。', 'bot');
        }
      }, 500);
    }

    window.confirmDraft = (h, auto, pending) => {
      draft += h;
      updateStats();
      showToast('已写入草稿 +' + h + 'h', 'success');
      addMsg('✓ 已加入草稿。回复「提交本周」完成提交。', 'bot');
    };

    window.doSubmit = async () => {
      const auto = draft * 0.75, pending = draft * 0.25;
      submitted += draft;
      const total = submitted;
      draft = 0;
      updateStats();
      await submitTimesheet({ paradigm: 'E', totalHours: total, autoHours: auto, pendingHours: pending, week: 'W21', unassigned: 0 });
    };

    document.querySelectorAll('.cmd').forEach(el => el.addEventListener('click', () => handleCmd(el.dataset.cmd)));
    document.getElementById('chat-send').addEventListener('click', () => {
      const v = document.getElementById('chat-input').value.trim();
      if (v) { handleCmd(v); document.getElementById('chat-input').value = ''; }
    });
    document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('chat-send').click(); });
    updateStats();
  </script>
</body>
</html>
